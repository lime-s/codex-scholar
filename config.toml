config_file = "__CODEX_HOME__/agents/kaggle-miner/config.toml"

[agents.research-knowledge-curator-obsidian]
description = "Default Obsidian knowledge curator for bound research repositories"
config_file = "__CODEX_HOME__/agents/research-knowledge-curator-obsidian/config.toml"

